<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WBTH Hardware Assets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "TH SarabunPSK Local"; src: local("TH SarabunPSK"), local("THSarabunPSK"), local("TH Sarabun PSK"); font-weight: 100 500; size-adjust: 132%; }
@font-face { font-family: "TH SarabunPSK Local"; src: local("TH SarabunPSK Bold"), local("THSarabunPSK-Bold"), local("TH Sarabun PSK Bold"); font-weight: 600 900; size-adjust: 132%; }
:root {
  /* layout: fixed left sidebar (nav + file) · main column with a search bar on top · one view at a time: overview, assets table, people */
  --paper: #ffffff;
  --side: #fafafa;
  --ink: #18181b;
  --muted: #71717a;
  --faint: #a1a1aa;
  --line: #e4e4e7;
  --soft: #f4f4f5;
  --dep: #16a34a; --stock: #2563eb; --broken: #d97706; --ret: #a1a1aa;
  --bad: #dc2626; --warn: #c2410c;
  --font: "TH SarabunPSK Local", "Sarabun", "Leelawadee UI", Tahoma, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); }
body { color: var(--ink); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
a { color: inherit; }
.ic { width: 18px; height: 18px; flex: none; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); padding: 5px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; white-space: nowrap; line-height: 1.4; }
.btn:hover { background: var(--soft); }
.btn .ic { width: 16px; height: 16px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: #000; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--soft); }
.btn.danger { color: var(--bad); }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-solid:hover { background: #b91c1c; }
.toast { display: flex; gap: 14px; align-items: center; }
.toast-act { all: unset; cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.btn.sm { padding: 2px 10px; font-size: 15px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn .count { background: var(--ink); color: #fff; border-radius: 999px; font-size: 12px; min-width: 18px; padding: 0 5px; line-height: 18px; text-align: center; }
.link { all: unset; cursor: pointer; color: var(--muted); font-size: 15px; display: inline-flex; align-items: center; gap: 2px; }
.link:hover, .link:focus-visible { color: var(--ink); }

/* shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.logo { width: 32px; height: 32px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 15px; letter-spacing: .02em; }
.brand b { display: block; font-size: 16px; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 13.5px; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 7px; text-decoration: none; color: var(--muted); font-weight: 500; }
.nav a:hover { background: #f0f0f1; color: var(--ink); }
.nav a[aria-current="page"] { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.nav .n { margin-left: auto; font-size: 13.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.side-file { margin-top: auto; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 12px; display: grid; gap: 8px; font-size: 14.5px; }
.side-file .fname { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; overflow-wrap: anywhere; line-height: 1.35; }
.side-file .fname .ic { color: var(--dep); margin-top: 1px; }
.side-file p { margin: 0; color: var(--muted); font-size: 13.5px; }
.side-file .btn { width: 100%; }
.tag-sample { display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--warn); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; padding: 10px 28px; flex-wrap: wrap; }
.search-trigger { flex: 1 1 280px; max-width: 520px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 6px 10px; color: var(--faint); cursor: text; text-align: left; }
.search-trigger:hover { border-color: #d4d4d8; }
.search-trigger span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
kbd { font: 12px/1 var(--font); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 3px 5px; color: var(--muted); background: var(--paper); }
.top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pending { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
.pending b { color: var(--ink); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.pending .dot { background: var(--warn); }

.view { padding: 26px 28px 56px; display: grid; gap: 20px; align-content: start; }
.page-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; }
.page-head h1 { font-size: 26px; line-height: 1.2; }
.page-head p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }

/* overview */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi:hover, .kpi:focus-visible { border-color: var(--ink); }
.kpi .lbl { color: var(--muted); font-size: 15px; display: flex; align-items: center; gap: 7px; }
.kpi .val { font-size: 34px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .sub { color: var(--faint); font-size: 14px; }
.kpi .sub b { color: var(--bad); font-weight: 600; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
@media (max-width: 520px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
.panel { border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel h2 { font-size: 17px; }
.panel .hint { color: var(--faint); font-size: 14px; margin: -6px 0 0; }
.bars { display: grid; gap: 2px; }
.bar-row { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 22px minmax(90px, 1fr) minmax(60px, 1.3fr) 40px; gap: 10px; align-items: center; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 15px; }
.bar-row.noicon { grid-template-columns: minmax(90px, 1fr) minmax(60px, 1.3fr) 40px; }
.bar-row:hover, .bar-row:focus-visible { background: var(--soft); }
.bar-row .ic { color: var(--muted); }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.bar-row .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.chart { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; align-items: end; height: 170px; padding-top: 6px; }
.chart .col { display: grid; grid-template-rows: auto 1fr auto; height: 100%; text-align: center; gap: 4px; }
.chart .cv { font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--ink); }
.chart .cv.zero { color: #d4d4d8; }
.chart .slot { display: flex; align-items: flex-end; border-bottom: 1px solid var(--line); }
.chart .b { display: block; width: 100%; background: var(--ink); border-radius: 3px 3px 0 0; min-height: 0; }
.chart .col.now .b { background: var(--warn); }
.chart .cm { font-size: 12.5px; color: var(--faint); white-space: nowrap; }
.list { display: grid; }
.li { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 6px; margin: 0 -6px; border-radius: 6px; }
.li:hover, .li:focus-visible { background: var(--soft); }
.li + .li { border-top: 1px solid var(--soft); }
.li .t { min-width: 0; }
.li .t b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .t small { color: var(--muted); font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .r { text-align: right; font-size: 14.5px; white-space: nowrap; }
.li .r small { display: block; color: var(--faint); font-size: 13px; }
.issue-n { font-weight: 600; font-variant-numeric: tabular-nums; }
.empty-note { color: var(--faint); font-size: 15px; padding: 6px 0; }

/* chips, status */
.ibox { width: 32px; height: 32px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; color: #52525b; flex: none; }
.ibox .ic { width: 17px; height: 17px; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; white-space: nowrap; }
.st-dep .dot { background: var(--dep); }
.st-stock .dot { background: var(--stock); }
.st-broken .dot { background: var(--broken); }
.st-ret { color: var(--muted); }
.st-ret .dot { background: var(--ret); }
.w-exp { color: var(--bad); }
.w-soon { color: var(--warn); }
.mark { font-size: 12.5px; font-weight: 600; margin-left: 6px; }
.mark.new { color: var(--dep); }
.mark.edited { color: var(--warn); }

/* assets view */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { all: unset; cursor: pointer; padding: 6px 12px 8px; color: var(--muted); font-weight: 500; display: inline-flex; gap: 7px; align-items: center; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab .n { color: var(--faint); font-size: 14px; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: relative; }
.tsearch { flex: 1 1 260px; max-width: 460px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; color: var(--faint); }
.tsearch:focus-within { border-color: var(--ink); }
.tsearch input { border: 0; outline: none; flex: 1; min-width: 0; background: transparent; color: var(--ink); }
.tsearch input::placeholder { color: var(--faint); }
.toolbar .spacer { flex: 1; }
.active-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.achip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 1px 4px 1px 10px; font-size: 14.5px; }
.achip span { color: var(--muted); }
.achip button { all: unset; cursor: pointer; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.achip button:hover { background: var(--line); color: var(--ink); }
.achip .ic { width: 14px; height: 14px; }
.pop { position: absolute; z-index: 25; top: calc(100% + 6px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.10); padding: 14px; display: grid; gap: 12px; }
.pop.filters { right: 0; width: min(560px, calc(100vw - 40px)); }
.pop.columns { right: 0; width: 230px; gap: 2px; padding: 8px; }
.pop h3 { font-size: 14px; color: var(--muted); font-weight: 500; }
.pop .typegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0 10px; }
.check { display: flex; gap: 8px; align-items: center; padding: 3px 4px; border-radius: 5px; cursor: pointer; font-size: 15px; }
.check:hover { background: var(--soft); }
.check input { accent-color: var(--ink); width: 15px; height: 15px; margin: 0; }
.check .n { margin-left: auto; color: var(--faint); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.check.zero { color: #c4c4c8; }
.selgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px 14px; }
.fsel { display: grid; gap: 2px; font-size: 14px; color: var(--muted); min-width: 0; }
.fsel select { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; background: var(--paper); font-size: 15px; color: var(--ink); }
.fsel select.on { border-color: var(--ink); }
.pop-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }

.tablebox { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.table-wrap { overflow: auto; max-height: calc(100vh - 250px); min-height: 220px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 15px; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--side); text-align: left; font-weight: 500; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; }
thead th button { all: unset; box-sizing: border-box; display: flex; gap: 4px; align-items: center; padding: 8px 12px; cursor: pointer; width: 100%; }
thead th button:hover, thead th button.sorted { color: var(--ink); }
thead th .arr { font-size: 10px; opacity: 0; }
thead th button:hover .arr { opacity: .4; }
thead th button.sorted .arr { opacity: 1; }
thead th.plain { padding: 8px 12px; }
tbody td { padding: 8px 12px; border-bottom: 1px solid var(--soft); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr[data-id] { cursor: pointer; }
tbody tr[data-id]:hover td { background: #fafafa; }
.cell-asset { display: flex; gap: 10px; align-items: center; min-width: 230px; }
.cell-asset .t { min-width: 0; line-height: 1.3; }
.cell-asset b { font-weight: 600; font-size: 15px; white-space: nowrap; }
.cell-asset small { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
.cell-two { line-height: 1.3; }
.cell-two small { display: block; color: var(--muted); font-size: 13.5px; }
.ownerlink { all: unset; cursor: pointer; font-weight: 500; }
.ownerlink:hover, .ownerlink:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
td.nw { white-space: nowrap; }
td.dimc, .dimc { color: #c4c4c8; }
.tfoot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14.5px; background: var(--side); }
.empty { text-align: center; color: var(--muted); padding: 48px 16px !important; cursor: default; }

/* people */
.people { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .people { grid-template-columns: minmax(0, 1fr); } }
.plist { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 170px); position: sticky; top: 74px; }
@media (max-width: 980px) { .plist { position: static; max-height: 360px; } }
.plist .tsearch { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; max-width: none; flex: none; padding: 9px 12px; }
.plist ul { list-style: none; margin: 0; padding: 4px; overflow-y: auto; }
.plist .grp { font-size: 13px; color: var(--faint); padding: 8px 8px 2px; }
.pitem { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: flex; gap: 10px; align-items: center; padding: 5px 8px; border-radius: 6px; }
.pitem:hover { background: var(--soft); }
.pitem[aria-current="true"] { background: var(--ink); color: #fff; }
.pitem[aria-current="true"] small, .pitem[aria-current="true"] .n { color: rgba(255,255,255,.7); }
.pitem .t { min-width: 0; flex: 1; line-height: 1.3; }
.pitem .t span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem small { color: var(--muted); font-size: 13.5px; }
.pitem .n { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.profile { display: grid; gap: 16px; }
.phead { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 600; font-size: 19px; color: #3f3f46; flex: none; }
.phead .who { flex: 1 1 220px; min-width: 0; }
.phead h2 { font-size: 26px; line-height: 1.2; }
.phead p { margin: 2px 0 0; color: var(--muted); }
.phead .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.pstats { display: flex; flex-wrap: wrap; gap: 8px; }
.pstat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; display: flex; gap: 8px; align-items: center; font-size: 15px; }
.pstat .ic { color: var(--muted); width: 16px; height: 16px; }
.pstat b { font-variant-numeric: tabular-nums; }
.alert { display: flex; gap: 8px; align-items: center; color: var(--warn); font-size: 15px; }
.alert .ic { width: 16px; height: 16px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.18); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--paper); z-index: 41; box-shadow: -16px 0 40px rgba(0,0,0,.08); display: flex; flex-direction: column; border-left: 1px solid var(--line); }
.dhead { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.dtop { display: flex; gap: 12px; align-items: flex-start; }
.dtop .ibox { width: 44px; height: 44px; border-radius: 10px; }
.dtop .ibox .ic { width: 22px; height: 22px; }
.dtop .t { flex: 1; min-width: 0; }
.dtop h2 { font-size: 22px; line-height: 1.2; overflow-wrap: anywhere; }
.dtop p { margin: 2px 0 0; color: var(--muted); }
.dacts { display: flex; gap: 8px; flex-wrap: wrap; }
.dbody { overflow-y: auto; padding: 6px 22px 22px; flex: 1; }
.dsec { padding: 12px 0 4px; }
.dsec h3 { font-size: 14px; color: var(--faint); font-weight: 500; margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 2px 12px; padding: 5px 0; font-size: 15.5px; }
.kv dt { color: var(--muted); font-size: 15px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv dd s { display: block; color: var(--faint); font-size: 14px; }
.dfoot { padding: 10px 22px; border-top: 1px solid var(--line); color: var(--faint); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.dfoot .grow { flex: 1; }
.iconbtn { all: unset; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--soft); color: var(--ink); }

/* modal */
.modal-wrap { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.2); }
.modal-wrap.top { align-items: start; padding-top: 10vh; }
.modal-wrap.top .modal { max-height: calc(90vh - 32px); }
.modal { background: var(--paper); border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,.14); width: min(860px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal.small { width: min(480px, 100%); }
.modal.mid { width: min(620px, 100%); }
.modal header { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding: 18px 22px 12px; border-bottom: 1px solid var(--line); }
.modal header h2 { font-size: 21px; }
.modal header p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.modal .body { overflow-y: auto; padding: 4px 22px 16px; }
.modal .body > p { margin: 12px 0 0; }
.modal footer { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 22px; border-top: 1px solid var(--line); }
.modal footer .grow { flex: 1; }
fieldset { border: 0; margin: 0; padding: 14px 0 6px; border-bottom: 1px solid var(--soft); }
fieldset:last-child { border-bottom: 0; }
legend { font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 18px; }
.field { display: grid; gap: 2px; min-width: 0; }
.field label { font-size: 14.5px; color: var(--muted); }
.field label .req { color: var(--bad); }
.field input, .field textarea { width: 100%; padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); font-size: 16px; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--ink); }
.field input.invalid { border-color: var(--bad); }
.note { font-size: 14px; color: var(--faint); }
.note.warn { color: var(--warn); }
.note.err { color: var(--bad); }
.note button { all: unset; cursor: pointer; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.hint { font-size: 14.5px; color: var(--faint); }
.opts { display: grid; gap: 8px; margin-top: 14px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--ink); }
.opt input { accent-color: var(--ink); margin-top: 5px; }
.opt b { font-weight: 600; display: block; }
.opt small { color: var(--muted); font-size: 14px; }
.change-list { margin: 12px 0 0; padding: 10px 12px; background: var(--side); border-radius: 8px; font-size: 14.5px; color: var(--muted); display: grid; gap: 2px; }
.change-list b { color: var(--ink); font-weight: 500; }
.picklist { list-style: none; margin: 10px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 9px; max-height: 340px; overflow-y: auto; }
.picklist li + li { border-top: 1px solid var(--soft); }
.picklist label { display: grid; grid-template-columns: 18px 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; cursor: pointer; }
.picklist label:hover { background: var(--side); }
.picklist input { accent-color: var(--ink); width: 15px; height: 15px; margin: 0; }
.picklist .t b { font-weight: 500; display: block; }
.picklist .t small { color: var(--muted); font-size: 14px; }

/* command palette */
.cmd { width: min(640px, 100%); }
.cmd .cin { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--faint); }
.cmd .cin input { flex: 1; border: 0; outline: none; font-size: 19px; color: var(--ink); background: transparent; }
.cmd .cres { max-height: 60vh; overflow-y: auto; padding: 6px; }
.cmd .cg { font-size: 13px; color: var(--faint); padding: 8px 10px 2px; }
.citem { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 7px; cursor: pointer; }
.citem[aria-selected="true"] { background: var(--soft); }
.citem .t { flex: 1; min-width: 0; line-height: 1.3; }
.citem .t b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.citem .t small { color: var(--muted); font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.citem .r { color: var(--faint); font-size: 14px; white-space: nowrap; }
.citem .av { width: 32px; height: 32px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: #3f3f46; flex: none; }
.cmd .cfoot { border-top: 1px solid var(--line); padding: 8px 16px; color: var(--faint); font-size: 13.5px; display: flex; gap: 14px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 8px; z-index: 60; max-width: calc(100% - 32px); font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.drop { position: fixed; inset: 0; z-index: 70; background: rgba(255,255,255,.92); border: 2px dashed var(--ink); display: grid; place-items: center; font-size: 24px; font-weight: 600; pointer-events: none; }

/* scanner */
#scanRoot .modal-wrap { z-index: 55; }
.modal .body.scan-body { display: grid; gap: 12px; padding-top: 14px; }
.viewfinder { position: relative; background: #111; border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3; max-height: 52vh; }
.viewfinder video, .viewfinder canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
.viewfinder video { object-fit: cover; }
.viewfinder .guide { position: absolute; left: 8%; right: 8%; top: 18%; bottom: 18%; border: 2px solid rgba(255,255,255,.9); border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.28); pointer-events: none; }
.viewfinder .vstatus { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 14px 10px; color: #fff; font-size: 15px; background: linear-gradient(transparent, rgba(0,0,0,.65)); }
.viewfinder.nocam { background: var(--side); border: 1px dashed #d4d4d8; aspect-ratio: auto; min-height: 120px; display: grid; place-items: center; }
.viewfinder.nocam .vstatus { position: static; background: none; color: var(--muted); text-align: center; padding: 20px; }
.scan-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.cands { display: grid; gap: 6px; }
.cands h3 { font-size: 14px; color: var(--muted); font-weight: 500; }
.cand { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.cand.best { border-color: var(--ink); }
.cand .t { flex: 1; min-width: 0; line-height: 1.3; }
.cand b { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; letter-spacing: .02em; }
.cand small { display: block; color: var(--muted); font-size: 13.5px; }
.with-btn { display: flex; gap: 6px; }
.with-btn input { flex: 1; min-width: 0; }
.sqbtn { padding: 0 9px; }
.scan-callout { display: flex; gap: 10px; align-items: center; margin-top: 14px; padding: 10px 12px; border: 1px dashed #d4d4d8; border-radius: 9px; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
.scan-callout span { flex: 1 1 220px; }
.scan-callout .ic { color: var(--ink); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { grid-auto-flow: column; }
  .nav .n { display: none; }
  .side-file { margin-top: 0; flex: 1 1 100%; grid-template-columns: 1fr auto; align-items: center; }
  .side-file p { display: none; }
  .side-file .btn { width: auto; }
  .top, .view { padding-left: 16px; padding-right: 16px; }
  .top { position: static; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .16s ease-out; }
  @keyframes slide { from { transform: translateX(16px); opacity: .7; } to { transform: none; opacity: 1; } }
}
</style>

function cellVal(v) {

/* ---------- workbook parsing ---------- */
function headerKey(name) {

    if (hit) return r;

  if (!hr) for (const w of wb.worksheets) { const h = findHeaderRow(w); if (h) { ws = w; hr = h; break; } }
  if (!ws || !hr) throw new Error('ไม่พบชีต Hardware ที่มีคอลัมน์ "Asset owner" ในไฟล์นี้');
  const headers = []; const used = new Set();
  ws.getRow(hr).eachCell((c, colNo) => {
    const name = String(cellVal(c.value) ?? '').trim();
    if (!name) return;
    let key = headerKey(name);
    if (key && used.has(key)) key = null;
    if (key) used.add(key);
    headers.push({ col: colNo, name, key, label: key === 'num' ? '#' : name });
  });

/* ---------- storage ---------- */
function bufToB64(buf) {

    edits: S.rows.filter(r => r.state === 'edited').map(r => ({ excelRow: r.excelRow, v: r.v })),

function passes(r, skip) {

  if (skip !== 'status' && F.status !== 'all' && r._st !== F.status) return false;
  if (skip !== 'type' && F.types.size && !F.types.has(r._fk.type)) return false;
  for (const [k, val] of Object.entries(F.sel)) {
    if (k === skip || val === null || val === undefined) continue;
    if (r._fk[k] !== val) return false;
  }
  if (skip !== 'issue' && F.issue && !r._issues.has(F.issue)) return false;
  if (F.q) for (const t of F.q.toLowerCase().split(/\s+/)) if (t && !r._hay.includes(t)) return false;
  return true;

      if (preset.sel) Object.assign(S.f.sel, preset.sel);
      if (preset.issue) S.f.issue = preset.issue;
    }
  }
  if (location.hash !== '#' + view) { S.view = view; history.replaceState(null, '', '#' + view); }

  window.scrollTo({ top: 0 });
}

function personText(name, rows) {
  const lines = [`อุปกรณ์ของ ${name} (${rows.length} รายการ)`];
  rows.forEach((r, i) => {
    const bits = [clean(get(r, 'type')), clean(get(r, 'desc'))].filter(Boolean).join(' – ');
    const ids = [['Asset', get(r, 'asset')], ['S/N', get(r, 'pserial')], ['Host', get(r, 'host')]]
      .filter(([, v]) => !NOT_ID.has(lower(v))).map(([k, v]) => `${k}: ${clean(v)}`).join(' | ');
    lines.push(`${i + 1}. ${bits}${ids ? ' | ' + ids : ''}`);
  });
  return lines.join('\n');
}

/* ---------- edits ---------- */
function sameVal(a, b) {
  if (a instanceof Date || b instanceof Date) return a instanceof Date && b instanceof Date && a.getTime() === b.getTime();
  return (isBlank(a) ? '' : a) === (isBlank(b) ? '' : b);
}
function setValues(r, changes) {
  if (r.state === 'orig') r.orig = { ...r.v };
  r.v = { ...r.v, ...changes };
  if (r.state !== 'new') {
    const changed = S.headers.some(h => !sameVal(r.v[h.col], r.orig[h.col]));
    r.state = changed ? 'edited' : 'orig'; if (!changed) r.orig = null;
  }
  prep(r);
}
function noteWith(r, text) {
  const cur = clean(get(r, 'note'));
  if (!text) return get(r, 'note');
  return cur && cur !== '-' ? `${cur} | ${text}` : text;
}
function afterChange(msg) {
  computeIssues(); persist(false); render();
  const d = $('#drawerRoot').dataset.id; if (d) openDrawer(d);
  toast(msg + (S.mode === 'file' ? ' · กดดาวน์โหลด Excel เพื่อบันทึกลงไฟล์' : ' (ข้อมูลตัวอย่าง)'));
}
function changeRows(r, changes) {
  return S.headers.filter(h => h.col in changes && !sameVal(changes[h.col], r.v[h.col]))
    .map(h => `<div>${esc(h.label)}: ${esc(clean(r.v[h.col]) || '(ว่าง)')} → <b>${esc(clean(changes[h.col]) || '(ว่าง)')}</b></div>`).join('');
}

function openDrawer(id) {
  const r = S.rows.find(x => x.id === id); if (!r) { closeDrawer(); return; }
  const kv = h => {
    const v = r.v[h.col]; let t = clean(v);
    let val = t ? esc(t) : '<span class="dimc">—</span>';
    if (h.key === 'warranty' && t) val = warrantyHtml(r);
    if (h.key === 'owner' && t && r._st === 'deployed') val = `<button class="ownerlink" type="button" data-owner="${esc(lower(v))}">${esc(t)}</button>`;
    let old = '';
    if (r.state === 'edited' && !sameVal(v, r.orig[h.col])) old = `<s>เดิม: ${esc(clean(r.orig[h.col]) || '(ว่าง)')}</s>`;
    return `<div class="kv"><dt>${esc(h.label)}</dt><dd>${val}${old}</dd></div>`;
  };
  const used = new Set();
  const sec = (title, keys) => {
    const hs = keys.map(k => S.headers.find(h => h.key === k)).filter(Boolean);
    hs.forEach(h => used.add(h.col));
    return hs.length ? `<div class="dsec"><h3>${title}</h3><dl>${hs.map(kv).join('')}</dl></div>` : '';
  };
  const secs = [sec('ผู้ถือครอง', ['owner', 'dept', 'loc', 'admin']), sec('อุปกรณ์', ['type', 'desc', 'os', 'asset', 'pserial', 'host']), sec('สัญญาและประกัน', ['start', 'warranty', 'poss', 'claim']), sec('สถานะในระบบ', ['disposal', 'lic', 'autopilot', 'note'])];
  const rest = S.headers.filter(h => !used.has(h.col) && h.key !== 'num');
  if (rest.length) secs.push(`<div class="dsec"><h3>อื่นๆ</h3><dl>${rest.map(kv).join('')}</dl></div>`);
  const main = r._st === 'deployed'
    ? `<button class="btn primary" type="button" id="dIn">${ic('undo-2')}รับคืน</button>`
    : `<button class="btn primary" type="button" id="dOut">${ic('arrow-right-left')}ส่งมอบ</button>`;
  const root = $('#drawerRoot'); root.dataset.id = id;
  root.innerHTML = `<div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dT">
      <div class="dhead">
        <div class="dtop">${iboxHtml(r)}<div class="t"><h2 id="dT">${esc(assetTitle(r))}${mark(r)}</h2><p>${esc(assetSub(r))}</p><div style="margin-top:4px">${statusHtml(r)}</div></div><button class="iconbtn" type="button" data-close aria-label="ปิด">${ic('x')}</button></div>
        <div class="dacts">${r._st === 'returned' ? '' : main}<button class="btn" type="button" id="dEdit">${ic('pencil')}แก้ไข</button><button class="btn" type="button" id="dCopy">${ic('copy')}คัดลอก</button>
          ${r.state === 'edited' ? `<button class="btn ghost" type="button" id="dRevert">คืนค่าเดิม</button>` : ''}<button class="btn ghost danger" type="button" id="dRemove">${ic('trash-2')}ลบ</button></div>

function orderRows() { S.rows.sort((a, b) => (a.excelRow ?? 1e9) - (b.excelRow ?? 1e9)); }
async function askRemove(r) {
  const where = r.state === 'new' ? 'รายการนี้เพิ่งเพิ่มในหน้านี้ จะหายไปเลย' : `${r.excelRow ? `แถว ${r.excelRow}` : 'แถวนี้'} จะถูกลบออกจากชีต ${S.sheetName} ตอนดาวน์โหลด Excel และแถวด้านล่างจะเลื่อนขึ้นมาแทน ถ้าเครื่องแค่ถูกคืนหรือเลิกใช้ แนะนำกด “รับคืน” แทน เพื่อให้ประวัติยังอยู่ในไฟล์`;
  if (!(await confirmDialog(`ลบ ${assetTitle(r)}?`, where, 'ลบ', true))) return;
  S.rows = S.rows.filter(x => x !== r);
  if (r.state !== 'new') S.deleted.push(r);
  closeDrawer(); computeIssues(); persist(false); render();
  toast(`ลบ ${assetTitle(r)} แล้ว${r.state !== 'new' && S.mode === 'file' ? ' · จะหายจากไฟล์เมื่อดาวน์โหลด Excel' : ''}`, { label: 'เลิกทำ', run: () => {
    S.deleted = S.deleted.filter(x => x !== r);
    if (!S.rows.includes(r)) S.rows.push(r);
    orderRows(); computeIssues(); persist(false); render(); toast(`เอา ${assetTitle(r)} กลับมาแล้ว`);
  } });
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) {
    showModal(`<div class="modal small" role="dialog" aria-modal="true" aria-labelledby="cT"><header><h2 id="cT">คัดลอกข้อความนี้</h2><button class="iconbtn" type="button" data-close aria-label="ปิด">${ic('x')}</button></header><div class="body"><textarea id="copyArea" style="width:100%;min-height:220px;margin-top:12px;font:15px/1.5 var(--font);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--side)">${esc(text)}</textarea></div><footer><span class="hint grow">กด Ctrl/⌘ + C เพื่อคัดลอก</span><button class="btn" type="button" data-close>ปิด</button></footer></div>`);
    const ta = $('#copyArea'); ta.focus(); ta.select();
  }
}
function confirmDialog(title, msg, okLabel, danger) {
  return new Promise(resolve => {
    showModal(`<div class="modal small" role="alertdialog" aria-modal="true" aria-labelledby="qT"><header><h2 id="qT">${esc(title)}</h2></header><div class="body"><p>${esc(msg)}</p></div><footer><span class="grow"></span><button class="btn" type="button" id="qNo">กลับ</button><button class="btn ${danger ? 'danger-solid' : 'primary'}" type="button" id="qYes">${esc(okLabel)}</button></footer></div>`);
    const done = v => { closeModal(); resolve(v); };
    $('#qNo').onclick = () => done(false); $('#qYes').onclick = () => done(true); $('#qNo').focus();
  });
}

/* ---------- wiring ---------- */
function wire() {
  $$('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
  const fi = $('#fileInput');
  fi.onchange = () => openFile(fi.files[0]);
  $('#btnAdd').onclick = () => {
    const o = S.view === 'people' ? ownerIndex().find(x => x.key === S.person) : null;
    openForm(null, o ? { owner: o.label, dept: o.dept } : null);
  };
  $('#btnExport').onclick = doExport;
  $('#btnDiscard').onclick = async () => {
    if (!(await confirmDialog('ยกเลิกการเปลี่ยนแปลงทั้งหมด?', `การเพิ่ม แก้ไข และลบ ${pendingCount()} รายการจะถูกยกเลิก แถวที่ลบไว้จะกลับมา ไฟล์ Excel เดิมไม่ถูกแตะ`, 'ยกเลิกทั้งหมด'))) return;
    S.rows.push(...S.deleted); S.deleted = [];
    S.rows = S.rows.filter(r => r.state !== 'new');
    S.rows.forEach(r => { if (r.state === 'edited') { r.v = r.orig; r.orig = null; r.state = 'orig'; prep(r); } });
    orderRows();
    closeDrawer(); computeIssues(); persist(false); render(); toast('ยกเลิกการเปลี่ยนแปลงแล้ว');
  };
  $('#cmdOpen').onclick = openCmd;
  $('#btnScan').onclick = scanLookup;
  $$('.nav a').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.view); });
  window.addEventListener('hashchange', () => { readHash(); render(); });
  document.addEventListener('click', closePops);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if ($('#cmdRoot').innerHTML) closeCmd(); else openCmd(); return; }
    if (e.key === '/' && !e.target.closest('input, textarea, select') && !$('#modalRoot').innerHTML) { e.preventDefault(); openCmd(); return; }
    if (e.key !== 'Escape') return;
    if ($('#scanRoot').innerHTML) closeScanner();
    else if ($('#cmdRoot').innerHTML) closeCmd();
    else if ($('#modalRoot').innerHTML) closeModal();
    else if ($$('.pop').some(p => !p.hidden)) closePops();
    else if ($('#drawerRoot').innerHTML) closeDrawer();
  });
  let depth = 0;
  window.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { depth++; $('#drop').hidden = false; } });
  window.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) $('#drop').hidden = true; });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); depth = 0; $('#drop').hidden = true; const f = e.dataTransfer?.files?.[0]; if (f) openFile(f); });
  window.addEventListener('beforeunload', () => persist(false));
}

async function init() {
  wire();
  try { const h = JSON.parse(localStorage.getItem(LS_COLS) || 'null'); if (Array.isArray(h)) S.hidden = new Set(h); } catch (e) { /* ignore */ }
  readHash();
  let restored = false;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      if (saved && saved.b64) { await loadBuffer(b64ToBuf(saved.b64), saved.name || 'inventory.xlsx', saved.changes); restored = true; }
    }
  } catch (e) { console.warn('restore failed', e); }
  if (!restored) loadSample();
  buildViews(); render();
  if (restored) toast(`เปิด ${S.fileName} ต่อจากครั้งก่อน` + (pendingCount() ? ` · มี ${pendingCount()} รายการที่ยังไม่ได้ดาวน์โหลด` : ''));
}
init();
})();
</script>
